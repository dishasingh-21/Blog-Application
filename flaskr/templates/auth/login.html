{% extends 'base.html' %}

{% block header %}
  <h1 class="post-heading">{% block title %}Log In{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="username">Username</label>
    <input name="username" placeholder="Your username" id="username" required>
    <label for="password">Password</label>
    <input type="password" placeholder="Your password" name="password" id="password" required>
    <input type="submit" value="Log In">
  </form>
{% endblock %}
